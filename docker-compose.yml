services:
  core:
    image: registry.cn-hangzhou.aliyuncs.com/cateyes/go:wb2api-core-1789526563
    platform: linux/amd64
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      WB2A_CORE: "true"
      WB2A_LISTEN: :7863
      WB2A_AUTH_DIR: /app/auths
      WB2A_STATE_FILE: /app/data/state.json
      WB2A_ADMIN_KEY: ${WB2A_ADMIN_KEY:-}
      WB2A_API_KEY: ${WB2A_API_KEY:-}
    volumes:
      - ./runtime/wb2api/auths:/app/auths
      - ./runtime/wb2api/data:/app/data
      - ./runtime/wb2api/keys:/run/wb2a

  console:
    image: registry.cn-hangzhou.aliyuncs.com/cateyes/go:wb2api-webui-1789526563
    platform: linux/amd64
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      WB2A_ADMIN_KEY: ${WB2A_ADMIN_KEY:-}
      WB2A_API_KEY: ${WB2A_API_KEY:-}
      WB2A_CORE_URL: http://core:7863
      WB2A_KEY_FILE: /run/wb2a/keys.json
      WB2A_PUBLIC_ORIGIN: ""
    ports:
      - "0.0.0.0:7863:7863"
    volumes:
      - ./runtime/wb2api/keys:/run/wb2a:ro
    depends_on:
      core:
        condition: service_started
