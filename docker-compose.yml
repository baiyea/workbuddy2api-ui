services:
  core:
    image: registry.cn-hangzhou.aliyuncs.com/cateyes/go:wb2api-core-1789550372
    platform: linux/amd64
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 可选：填写后取消注释，否则自动生成并持久化。两个服务的同名密钥必须一致。
      # WB2A_ADMIN_KEY: "" # 至少 32 字节，且与 API Key 不同
      # WB2A_API_KEY: ""
    volumes:
      - ./runtime/wb2api/auths:/app/auths
      - ./runtime/wb2api/data:/app/data
      - ./runtime/wb2api/keys:/run/wb2a

  console:
    image: registry.cn-hangzhou.aliyuncs.com/cateyes/go:wb2api-webui-1789550372
    platform: linux/amd64
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 可选：填写后取消注释，否则使用自动生成的密钥。与 core 中的同名密钥保持一致。
      # WB2A_ADMIN_KEY: "" # 至少 32 字节，且与 API Key 不同
      # WB2A_API_KEY: ""
    ports:
      - "0.0.0.0:7863:7863"
    volumes:
      - ./runtime/wb2api/keys:/run/wb2a:ro
    depends_on:
      core:
        condition: service_started
